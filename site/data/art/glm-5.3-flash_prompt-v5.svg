<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#f6f1e3"/>

  <!-- ============ A frame (upright reading) ============ -->
  <g fill="none" stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">

    <!-- head + hat silhouette (top = A's hat / B's chin ; bottom = A's chin / B's hat) -->
    <path stroke-width="9" fill="#f6f1e3"
      d="M 330 380 C 322 300 380 235 470 218 C 585 196 672 285 680 380
         C 688 470 690 560 665 660 C 645 740 580 800 500 806
         C 420 800 355 740 335 660 C 318 570 322 470 330 380 Z"/>

    <!-- hat brim (A) = nose tip (B) -->
    <path stroke-width="8" d="M 322 368 Q 500 344 682 368"/>

    <!-- hairline (A) = nose bridge (B) -->
    <path stroke-width="5" d="M 430 392 Q 465 375 500 390 Q 540 375 572 392"/>

    <!-- shared eyes -->
    <circle cx="415" cy="500" r="24" stroke-width="7"/>
    <circle cx="585" cy="500" r="24" stroke-width="7"/>
    <circle cx="415" cy="500" r="9" fill="#1a1a1a" stroke="none"/>
    <circle cx="585" cy="500" r="9" fill="#1a1a1a" stroke="none"/>

    <!-- shared lid crease -->
    <path stroke-width="5" d="M 385 478 Q 415 466 448 478"/>
    <path stroke-width="5" d="M 552 478 Q 585 466 618 478"/>

    <!-- A: raised eager brows (become B's eye-bags) -->
    <path stroke-width="7" d="M 370 448 Q 415 424 460 448"/>
    <path stroke-width="7" d="M 540 448 Q 585 424 630 448"/>

    <!-- A: big grin (becomes B's hat band) -->
    <path stroke-width="8" d="M 415 668 Q 500 732 585 668"/>
    <path stroke-width="6" d="M 440 676 Q 500 716 560 676"/>
    <path stroke-width="6" d="M 415 668 L 396 658"/>
    <path stroke-width="6" d="M 585 668 L 604 658"/>

    <!-- A: hat ticks (become B's chin stubble) -->
    <path stroke-width="4" d="M 420 275 L 414 316"/>
    <path stroke-width="4" d="M 500 262 L 500 306"/>
    <path stroke-width="4" d="M 580 272 L 586 314"/>

    <!-- A prop: triumphant straight antenna with beacon -->
    <path stroke-width="6" d="M 500 214 L 500 152"/>
    <circle cx="500" cy="136" r="13" fill="#b23a2e" stroke-width="5"/>

    <!-- pompom/bow (shared): A's bow tie = B's pompom -->
    <path d="M 500 895 L 428 864 L 428 926 Z" fill="#b23a2e" stroke-width="6"/>
    <path d="M 500 895 L 572 864 L 572 926 Z" fill="#b23a2e" stroke-width="6"/>
    <circle cx="500" cy="895" r="17" fill="#b23a2e" stroke-width="5"/>
    <!-- stem: A's neck line = B's pompom stem -->
    <path stroke-width="5" d="M 500 806 L 500 858"/>

    <!-- ============ B-only strokes (drawn in B's upright frame) ============ -->
    <g transform="rotate(180 500 500)">
      <!-- B: heavy drooping lids (inert in A: lower-lid lines) -->
      <path stroke-width="6" d="M 378 488 Q 415 502 452 488"/>
      <path stroke-width="6" d="M 548 488 Q 585 502 622 488"/>
      <!-- B: weary furrow (inert in A: cheek creases) -->
      <path stroke-width="4" d="M 468 438 L 472 468"/>
      <path stroke-width="4" d="M 530 438 L 526 468"/>
      <!-- B: sour downturned mouth (in A: a decoration curve inside the hat) -->
      <path stroke-width="7" d="M 435 705 Q 500 662 565 705"/>
      <!-- B prop: drooping dead antenna (in A: a limp curl at the collar) -->
      <path stroke-width="5" d="M 500 190 Q 470 162 488 140"/>
      <circle cx="492" cy="133" r="8" fill="#b23a2e" stroke-width="4"/>
    </g>
  </g>
</svg>
